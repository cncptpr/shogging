name = "shogg"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_http = ">= 3.0.0 and < 5.0.0"

# This fork of parsed_it is patched, to preserve whitespace instead of
# normalizing it, since I need the newlines to parse the ical strings.
# TODO: Do the preseving also for JS
parsed_it = { git = "https://github.com/cncptpr/parsed_it", ref="cb0fd07" }
youid = ">= 1.5.1 and < 2.0.0"
gleam_time = ">= 1.7.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.1.0 and < 2.0.0"
birdie = ">= 1.5.4 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
# Only the integration test speaks HTTP itself; the library stays IO-agnostic
# and its consumers bring their own backend (see example/gleam.toml).
gleam_hackney = ">= 1.3.3 and < 2.0.0"
