[tasks."server:dev"]
description = "Run dev server for shogging"
run = "gleam run"
depends = [ "server:tailwindcss" ]
dir = "server"

[tasks."server:tailwindcss"]
description = "Run tailwindcss on the server"
run = "mise exec npm:tailwindcss/cli -- tailwindcss -i ./src/css/app.css -o ./priv/tailwind.css"
dir = "server"

[tasks."shogg:test"]
description = "Run test for shogg"
run = "gleam test"
dir = "shogg"

[env]
CALDAV_HOST = { age = "" }
CALDAV_USERNAME = { age = "" }
CALDAV_PASSWORD = { age = "" }
CALDAV_CALENDAR = "Shogging Test"
CHECK_CHANGE_DELAY = "20"

[tools]
"npm:@tailwindcss/cli" = "latest"

