[tasks.watch]
description = "Watch for changes and rerun dev"
run = "watchexec --wrap-process=session --restart -iet 'clear && mise run dev'"

[tasks.dev]
description = "Run server for dev"
run = "gleam run"
dir = "server"


[env]
CALDAV_HOST = { age = "" }
CALDAV_USERNAME = { age = "" }
CALDAV_PASSWORD = { age = "" }
CALDAV_CALENDAR = "Personal Calendar"
CHECK_CHANGE_DELAY = "20"

[tools]
watchexec = "latest"

