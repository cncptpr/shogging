[tasks.watch]
description = "Watch for changes and rerun dev"
run = "watchexec --wrap-process=session --restart -iet 'clear && mise run dev'"

[tasks.dev]
description = "Run server for dev"
run = "gleam run"
depends = [ "web-build" ]
dir = "server"

[tasks.web-build]
description = "Build the website into server's /priv/static"
run = "gleam run -m lustre/dev build --outdir=../server/priv/static && rm ../server/priv/static/index.html"
dir = "website"

[env]
CALDAV_HOST = { age = "" }
CALDAV_USERNAME = { age = "" }
CALDAV_PASSWORD = { age = "" }
CALDAV_CALENDAR = "Personal Calendar"

[tools]
watchexec = "latest"

