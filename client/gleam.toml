name = "client"
version = "1.0.0"
target = "javascript"

# The shogging frontend: a Lustre SPA that talks to the backend over a
# WebSocket. In development `gleam run -m lustre/dev start` serves it with live
# reload, for a real build `gleam run -m lustre/dev build` writes it into the
# server's priv/static directory so the backend can serve it.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
lustre = ">= 5.6.0 and < 6.0.0"
shared = { path = "../shared" }
lustre_websocket = ">= 1.1.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
# Platform bindings, used to read the configuration the server bakes into the
# page. See client/src/config.gleam.
plinth = ">= 0.11.0 and < 1.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.0.0 and < 3.0.0"

[tools.lustre.build]
outdir = "../server/priv/static"

[tools.lustre.dev]
port = 4321
# The dev server proxies the socket to the backend (transparently tunneling
# the WebSocket upgrade), so the app always uses a relative /ws and never
# needs to know the backend's port.
proxy = { from = "/ws", to = "http://localhost:1234/ws" }

[tools.lustre.html]
title = "Shogging"

[tools.lustre.bin]
# Use the binaries shipped by nix (see devenv.nix) instead of letting the dev
# tools download their own, which would not run on NixOS.
bun = "system"
tailwindcss = "system"
